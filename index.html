<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Smart Academic Planner — Free & Local</title>

<!-- Fonts + simple styles to match your vibe -->
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--card:#fff;--border:#e7e7e7;--ink:#111;--muted:#666;}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.page{max-width:1100px;margin:32px auto;padding:0 16px}
.hero{margin:0 0 24px 0} .hero h1{font-family:"Source Serif 4",serif;font-size:2.2rem;margin:.25rem 0}
.pill{display:inline-block;font-size:.8rem;border:1px solid var(--border);border-radius:999px;padding:2px 8px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
label{font-weight:600} .muted{color:var(--muted);font-size:.9rem}
button{cursor:pointer;border:1px solid var(--border);background:#111;color:#fff;border-radius:8px;padding:8px 12px}
.layout{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.main{flex:2;min-width:540px} .side{flex:1;min-width:320px}
.scroll{overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #dedede;padding:.75rem;text-align:left;vertical-align:top}
th{background:#f3ebe2;font-weight:600}
.unit-total td{background:#f9f5f0;font-weight:500}
.chatlog{height:320px;border:1px solid #eee;background:#fafafa;border-radius:8px;padding:8px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
.msg{margin:6px 0;white-space:pre-wrap}.msg.user{color:#1d4ed8}.msg.ai{color:#0f766e}
.row{display:flex;gap:8px;margin-top:8px} .row input{flex:1}
.badge{display:inline-block;background:#eef;border:1px solid #ccd;border-radius:6px;padding:2px 6px;margin-left:8px;font-size:.8rem;color:#334}
</style>

<!-- pdf.js (client-side PDF text extraction) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>

<!-- Prefer local WebLLM if you commit assets/webllm/index.min.js; otherwise fall back to CDNs -->
<script>
(async function loadWebLLM(){
  const local = "./assets/webllm/index.min.js"; // optional: add file to your repo to avoid CDNs
  const cdns = [
    "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/dist/index.min.js",
    "https://unpkg.com/@mlc-ai/web-llm@0.2.79/dist/index.min.js",
    "https://esm.sh/@mlc-ai/web-llm@0.2.79/dist/index.min.js"
  ];
  const sources = [local, ...cdns];
  for (const src of sources){
    try {
      await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.defer=true; s.onload=res; s.onerror=rej; document.head.appendChild(s);});
      if (window.webllm) break;
    } catch {}
  }
  console.log("webllm present?", !!window.webllm);
})();
</script>
</head>
<body>
<div class="page">
  <header class="hero">
    <span class="pill">100% free • runs in your browser</span>
    <h1>🎓 Planner that works for you.</h1>
    <p class="muted">Upload your degree audit and get a personalized 4-year plan in seconds.</p>
  </header>

  <div class="layout">
    <section class="main">
      <form id="form" class="card">
        <label for="file">Upload a Degree Audit (PDF or TXT)</label>
        <input id="file" type="file" accept=".pdf,.txt" required />
        <div class="row">
          <button id="gen" type="submit">Generate My Plan</button>
          <button id="export" type="button" title="Download JSON" disabled>Export JSON</button>
        </div>
        <div id="status" class="muted" style="margin-top:8px;"></div>
        <div id="env" class="muted" style="margin-top:6px"></div>
      </form>

      <section id="results" class="card" style="display:none;">
        <h2>📅 4-Year Plan <span id="modelBadge" class="badge"></span></h2>
        <div id="table" class="scroll"></div>
      </section>
    </section>

    <aside class="side">
      <h3 style="margin:0 0 8px 0;">🗣️ Ask the Advisor</h3>
      <div class="card">
        <div id="chat" class="chatlog"></div>
        <div class="row">
          <input id="chatInput" type="text" placeholder="Ask about prerequisites, alternatives, workload…" />
          <button id="send" type="button">Send</button>
        </div>
        <div class="muted" style="margin-top:6px">First load can take a few minutes while the model downloads & compiles.</div>
      </div>
    </aside>
  </div>
</div>

<script>
/* ---------------- Config ---------------- */
const ALL_TERMS = [
  "Fall 2022","Winter 2023","Spring 2023","Summer 2023",
  "Fall 2023","Winter 2024","Spring 2024","Summer 2024",
  "Fall 2024","Winter 2025","Spring 2025","Summer 2025"
];

const PLAN_SYSTEM_PROMPT = `
You are an academic advisor.

Given a student's degree audit, generate a 4-year academic plan from Fall 2022 to Summer 2025 (max 12 quarters).

Rules:
- Include only future/planned courses (do not repeat completed).
- Up to 4 courses per term.
- Include "unit_total" per term.
- Try not to exceed 16 units/term unless required.
- Leave summers empty if not needed.
- Fulfill all remaining requirements (major, GE, math/science, upper division, etc.).

Return ONLY a valid JSON array. If uncertain, return "[]".
Example:
[
  {"term":"Fall 2022","courses":[{"name":"CSE 110","category":"Major","units":4}],"unit_total":4}
]`;

/* ------------- Elements / State ------------- */
const form = document.getElementById('form');
const fileEl = document.getElementById('file');
const genBtn = document.getElementById('gen');
const exportBtn = document.getElementById('export');
const statusEl = document.getElementById('status');
const envEl = document.getElementById('env');
const results = document.getElementById('results');
const tableEl = document.getElementById('table');
const modelBadge = document.getElementById('modelBadge');

const chatEl = document.getElementById('chat');
const chatInput = document.getElementById('chatInput');
const chatSend = document.getElementById('send');

let engine = null;
let lastPlan = null;
let lastAuditText = "";
let chatHistory = [];

/* ------------ Utilities ------------ */
const esc = s => String(s).replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function addMsg(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  div.textContent = (role==='user'?'You: ':'Advisor: ') + text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function extractJSONArray(text){
  const m = text.match(/\[\s*[\s\S]*\]/);
  if (!m) throw new Error("No JSON array found in model output.");
  return JSON.parse(m[0]);
}

function normalizePlan(plan, terms){
  if (!Array.isArray(plan)) throw new Error("Plan is not a JSON array.");
  const byTerm = {};
  for (const t of plan) if (t && typeof t === 'object' && t.term) byTerm[t.term] = t;
  const out = [];
  for (const term of terms){
    const t = byTerm[term] || { term, courses: [], unit_total: 0 };
    const inCourses = Array.isArray(t.courses) ? t.courses.slice(0,4) : [];
    const courses = [];
    for (const c of inCourses){
      if (!c || typeof c !== 'object') continue;
      const name = String(c.name ?? '').trim(); if (!name) continue;
      const category = String(c.category ?? '').trim();
      const units = Number.isFinite(+c.units) ? parseInt(c.units,10) : 0;
      courses.push({ name, category, units });
    }
    const unit_total = courses.reduce((a,c)=>a+(c.units||0),0);
    out.push({ term, courses, unit_total });
  }
  return out;
}

function renderTable(terms, plan){
  let html = '<table><tr>';
  for (const t of terms) html += `<th>${t}</th>`;
  html += '</tr>';
  for (let row=0; row<4; row++){
    html += '<tr>';
    for (const term of terms){
      const m = plan.find(p=>p.term===term);
      if (m && m.courses[row]){
        const c = m.courses[row];
        html += `<td>${esc(c.name)}<br>${esc(c.category)}<br>${c.units} units</td>`;
      } else html += '<td></td>';
    }
    html += '</tr>';
  }
  html += '<tr class="unit-total">';
  for (const term of terms){
    const m = plan.find(p=>p.term===term);
    html += `<td>Unit Total: ${m?m.unit_total:0}</td>`;
  }
  html += '</tr></table>';
  return html;
}

/* --------- File reading (PDF/TXT client-side) --------- */
async function readFileAsText(file){
  const name = file.name.toLowerCase();
  if (name.endsWith(".txt")) return await file.text();
  if (name.endsWith(".pdf")){
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let out = "";
    for (let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      out += tc.items.map(it=>it.str).join(" ") + "\n";
    }
    return out;
  }
  throw new Error("Unsupported file type. Upload .pdf or .txt.");
}

/* --------- WebLLM Init (main-thread engine) --------- */
async function waitForWebLLM(ms=45000){
  const start = Date.now();
  while (!window.webllm){
    if (Date.now()-start > ms) throw new Error("WebLLM failed to load.");
    await new Promise(r=>setTimeout(r,100));
  }
  if (!window.webllm.CreateMLCEngine){
    throw new Error("CreateMLCEngine unavailable (Pages blocks worker mode; we use main-thread).");
  }
}

async function ensureEngine(){
  if (engine) return engine;
  await waitForWebLLM();
  envEl.innerHTML = `WebGPU: <b>${!!navigator.gpu}</b>`;
  statusEl.textContent = "Loading model (first load can take a few minutes)…";
  // Choose small instruct model hosted by MLC
  engine = await window.webllm.CreateMLCEngine({
    model: "Phi-3-mini-4k-instruct-q4f16_1",
    model_id: "mlc-ai/Phi-3-mini-4k-instruct-q4f16_1-MLC"
    // Alt: Qwen 2.5 3B
    // model: "Qwen2.5-3B-Instruct-q4f16_1",
    // model_id: "mlc-ai/Qwen2.5-3B-Instruct-q4f16_1-MLC"
  });
  modelBadge.textContent = "Phi-3-mini (q4)";
  statusEl.textContent = "Model ready ✓";
  return engine;
}

/* ----------------- Generate Plan ----------------- */
form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const file = fileEl.files[0];
  if (!file){ statusEl.textContent = "Please choose a file."; return; }

  try{
    statusEl.textContent = "Reading audit…";
    const text = (await readFileAsText(file)).trim();
    if (!text){ statusEl.textContent = "Couldn’t extract text. If PDF is scanned, upload a .txt export."; return; }
    lastAuditText = text;
  }catch(err){
    statusEl.textContent = "Error: " + err.message; return;
  }

  try { await ensureEngine(); }
  catch(err){ statusEl.textContent = "Model failed to load: " + (err?.message||err); return; }

  statusEl.textContent = "Thinking…";
  const prompt = `${PLAN_SYSTEM_PROMPT.trim()}\n\nDegree audit:\n${lastAuditText}\n\nReturn ONLY the JSON array.`;

  try{
    const out = await engine.chat.completions.create({
      messages: [{ role:"user", content: prompt }],
      max_tokens: 900,
      temperature: 0.2
    });
    const text = out?.choices?.[0]?.message?.content || "";
    const plan = extractJSONArray(text);
    lastPlan = normalizePlan(plan, ALL_TERMS);
    tableEl.innerHTML = renderTable(ALL_TERMS, lastPlan);
    results.style.display = "";
    exportBtn.disabled = false;
    statusEl.textContent = "Done ✓";

    // Seed chat context
    chatHistory = [
      { role:"system", content:"You are a helpful academic advisor." },
      { role:"user", content:"Here is my degree audit:\n" + lastAuditText.slice(0,6000) },
      { role:"assistant", content:"I generated a 4-year plan as JSON. Ask me anything about it." }
    ];
    addMsg("ai","Plan created. Ask about prerequisites, workload balance, or alternatives!");
  }catch(err){
    statusEl.textContent = "Error: " + (err?.message||err);
  }
});

/* ----------------- Export JSON ----------------- */
exportBtn.addEventListener('click', ()=>{
  if (!lastPlan) return;
  const blob = new Blob([JSON.stringify(lastPlan,null,2)], {type:"application/json"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "academic_plan.json";
  a.click();
  URL.revokeObjectURL(a.href);
});

/* ----------------- Chat ----------------- */
chatSend.addEventListener('click', sendChat);
chatInput.addEventListener('keydown', e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendChat(); } });

async function sendChat(){
  const msg = chatInput.value.trim();
  if (!msg) return;
  chatInput.value = "";
  addMsg("user", msg);

  try{
    await ensureEngine();
    const messages = [...chatHistory, { role:"user", content: msg }];
    const out = await engine.chat.completions.create({
      messages, max_tokens: 400, temperature: 0.2
    });
    const reply = out?.choices?.[0]?.message?.content || "(no reply)";
    addMsg("ai", reply);
    chatHistory = messages.slice(-12).concat({ role:"assistant", content: reply });
  }catch(e){
    addMsg("ai","Sorry — my local model had trouble responding. Try again.");
  }
}
</script>
</body>
</html>
